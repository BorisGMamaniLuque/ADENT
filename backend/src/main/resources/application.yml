server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: adent-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/adent}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: ${DB_POOL_MIN:2}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    time-zone: America/Lima
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:true}
          starttls:
            enable: ${SMTP_STARTTLS:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
  health:
    mail:
      enabled: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html

adent:
  demo:
    data-enabled: ${ADENT_DEMO_DATA_ENABLED:false}
  jwt:
    secret: ${JWT_SECRET:ADENT-DEV-SECRET-CHANGE-THIS-KEY-1234567890}
    access-token-minutes: ${JWT_ACCESS_MINUTES:480}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  seed:
    enabled: ${SEED_ENABLED:true}
    superadmin:
      username: ${SUPERADMIN_USERNAME:superadmin}
      password: ${SUPERADMIN_PASSWORD:ChangeMe123!}
    owner:
      username: ${OWNER_USERNAME:owner}
      password: ${OWNER_PASSWORD:Owner123!}
    demo-tenant: ${DEMO_TENANT:demo-dental}

  recovery:
    expires-minutes: ${RECOVERY_EXPIRES_MINUTES:15}
    dev-show-code: ${RECOVERY_DEV_SHOW_CODE:true}
    email:
      enabled: ${RECOVERY_EMAIL_ENABLED:false}
      from: ${SMTP_FROM:no-reply@adent.local}
    sms:
      enabled: ${RECOVERY_SMS_ENABLED:false}
      twilio:
        account-sid: ${TWILIO_ACCOUNT_SID:}
        auth-token: ${TWILIO_AUTH_TOKEN:}
        from-number: ${TWILIO_FROM_NUMBER:}

  public-sites:
    template-path: ${PUBLIC_SITE_TEMPLATE_PATH:../public-web/template-base}
    generated-root: ${PUBLIC_SITE_GENERATED_ROOT:../public-web/generated-sites}
